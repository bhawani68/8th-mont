<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>8 months with you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120a1f; --ink:#fff7f0; --muted:#cbb8d9; --pink:#ff7eb6; --gold:#ffd36e;
    --card:rgba(30,18,50,.92);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .caption{position:fixed;left:0;right:0;bottom:0;text-align:center;
    padding:0 20px calc(28px + env(safe-area-inset-bottom,0px));
    opacity:0;transform:translateY(12px);transition:opacity 1.4s ease,transform 1.4s ease;pointer-events:none}
  .caption.show{opacity:1;transform:none;pointer-events:auto}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic;
    font-size:clamp(2rem,8vw,3.4rem);line-height:1.1}
  .sub{color:var(--muted);margin-top:6px;font-size:1rem}
  button{margin-top:16px;font:600 1rem 'Nunito',sans-serif;color:#2a1238;background:var(--gold);
    border:0;border-radius:999px;padding:12px 26px;cursor:pointer}
  button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
  .note{position:fixed;inset:0;display:grid;place-items:center;padding:24px;
    background:rgba(10,5,18,.6);opacity:0;pointer-events:none;transition:opacity .5s}
  .note.open{opacity:1;pointer-events:auto}
  .note .card{max-width:440px;width:100%;max-height:85vh;overflow:auto;background:var(--card);
    border:1px solid rgba(255,126,182,.35);border-radius:18px;padding:28px 24px;
    transform:scale(.95);transition:transform .5s}
  .note.open .card{transform:none}
  .card h2{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:1.9rem;margin-bottom:12px}
  .card p{line-height:1.65;margin-bottom:12px;max-width:60ch}
  .card .sig{color:var(--gold);margin-top:6px}
  .hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;
    font-size:.85rem;color:var(--muted);opacity:0;transition:opacity 1s}
  .hint.show{opacity:.8}
  .ask{position:fixed;left:50%;top:40%;width:min(88vw,520px);text-align:center;z-index:5;
    transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;
    transition:opacity .9s ease,transform .9s cubic-bezier(.2,1.3,.4,1);text-shadow:0 0 18px rgba(18,10,31,.95),0 0 6px rgba(18,10,31,.9)}
  .ask.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .ask .q{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;
    font-size:clamp(1.9rem,8vw,3.2rem);line-height:1.1}
  .ask .qs{color:var(--gold);margin-top:6px;min-height:1.4em}
  .ask .btns{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:12px;min-height:56px}
  .ask.show button{pointer-events:auto}
  .ask button{margin:0;transition:transform .25s ease}
  #yes{background:var(--pink);color:#2a1238}
  #no{background:transparent;color:var(--ink);border:2px solid var(--pink)}
  .fly{position:fixed;bottom:-30px;z-index:9;pointer-events:none;animation:up var(--d,4s) ease-in forwards}
  @keyframes up{to{transform:translateY(-110vh) rotate(var(--r,20deg));opacity:.2}}
</style>
</head>
<body>
<canvas id="c" aria-label="A portrait made of dots"></canvas>
<div class="hint" id="hint">touch the dots</div>

<div class="ask" id="ask" aria-live="polite">
  <p class="q" id="q"></p>
  <p class="qs" id="qs"></p>
  <div class="btns" id="btns"><button id="yes">Yes 💖</button><button id="no">No 🥺</button></div>
</div>

<div class="caption" id="cap">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <button id="open">Read my note</button>
</div>

<div class="note" id="note" role="dialog" aria-modal="true" aria-labelledby="nt">
  <div class="card">
    <h2 id="nt"></h2>
    <div id="body"></div>
    <p class="sig" id="sig"></p>
    <button id="close">Close</button>
  </div>
</div>

<script>
/* ===== EDIT THESE ===== */
const CONFIG = {
  herName: "Parvati",
  yourName: "apka hathi 🐘",
  subtitle: "8 months of us",
  question: "Can we go for a date?",
  questionHint: "pretty please 🌸",
  yesTitle: "Yay! 🎉",
  yesLine: "Best answer ever. I'll plan something special 💕",
  noteTitle: "Eight months, and counting",
  noteLines: [
    "Eight months ago I didn't know how much brighter ordinary days could get.",
    "Thank you for every laugh, every late-night talk, and every time you made me feel at home.",
    "Here's to many more months with you."
  ],
  invert: false                     // set true only if the face looks like a photo negative
};
/* ====================== */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PALETTE = ['#ffffff','#ffffff','#ff7eb6','#ffd36e','#7ee0ff','#b69cff'];
let W, H, DPR, particles = [], img = null, started = 0;
const ptr = {x:-999,y:-999,on:false};
const portrait = {cx:0, cy:0, a:200, b:100};
let asked = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

if(!matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent='click the dots';
document.getElementById('title').textContent = "Happy 8 months, " + CONFIG.herName;
document.getElementById('sub').textContent = CONFIG.subtitle;
document.getElementById('nt').textContent = CONFIG.noteTitle;
document.getElementById('body').innerHTML = CONFIG.noteLines.map(t => {
  const p = document.createElement('p'); p.textContent = t; return p.outerHTML; }).join('');
document.getElementById('sig').textContent = "Forever yours, " + CONFIG.yourName;

function size(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* Her portrait: dot positions were pre-computed from her photo (POINTS) */
function buildTargets(){
  const areaW = Math.min(W*0.96, 1000), areaH = H*0.62;
  let w = areaW, h = w*ROWS/COLS;
  if(h > areaH){ h = areaH; w = h*COLS/ROWS; }
  const step = w/COLS, ox = (W-w)/2, oy = Math.max(44,(H*0.80-h)/2);
  portrait.cx = W/2; portrait.cy = oy + h/2;
  portrait.a = Math.min(W*0.44, 320); portrait.b = Math.min(135, h*0.42);
  return POINTS.map(([c,r,v])=>{ v/=100;
    return {x:ox+c*step+step/2, y:oy+r*step+step/2, r:step*0.5*(0.25+0.75*v), v}; });
}

function edgePoint(){
  const t = Math.random()*2*(W+H), m = 10;
  if(t<W) return [t,-m]; if(t<W+H) return [W+m,t-W];
  if(t<2*W+H) return [t-W-H,H+m]; return [-m,t-2*W-H];
}

function build(keepPos){
  const old = particles;
  const targets = buildTargets();
  particles = targets.map((t,i)=>{
    const [sx,sy] = edgePoint();
    const prev = keepPos && old[i];
    const hue = t.v>0.8 ? '#ffffff' : PALETTE[(Math.random()*PALETTE.length)|0];
    return {tx:t.x, ty:t.y, ox:t.x, oy:t.y, jit:Math.random(), r:t.r, c:hue,
      x:prev?prev.x:(reduce?t.x:sx), y:prev?prev.y:(reduce?t.y:sy), vx:0, vy:0,
      k:.012+Math.random()*.02, delay:reduce?0:Math.random()*1400};
  });
}

function frame(now){
  if(!started) started = now;
  const el = now-started;
  ctx.clearRect(0,0,W,H);
  const cxm=W/2, cym=H/2;
  for(const p of particles){
    if(el>=p.delay){
      // spring toward target, with a slight swirl while travelling
      const dx=p.tx-p.x, dy=p.ty-p.y, dist=Math.hypot(dx,dy);
      p.vx += dx*p.k; p.vy += dy*p.k;
      if(dist>40){ p.vx += -dy*0.0009*Math.min(dist,300)/60; p.vy += dx*0.0009*Math.min(dist,300)/60; }
      if(ptr.on){
        const px=p.x-ptr.x, py=p.y-ptr.y, d2=px*px+py*py, R=90;
        if(d2<R*R){ const d=Math.sqrt(d2)||1, f=(1-d/R)*5; p.vx+=px/d*f; p.vy+=py/d*f; }
      }
      p.vx*=.86; p.vy*=.86; p.x+=p.vx; p.y+=p.vy;
    }
    ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();
  }
  requestAnimationFrame(frame);
}

function pointer(e){
  const t = e.touches ? e.touches[0] : e;
  if(!t){ ptr.on=false; return; }
  ptr.x=t.clientX; ptr.y=t.clientY; ptr.on=true;
}
addEventListener('mousemove',pointer);
addEventListener('touchstart',pointer,{passive:true});
addEventListener('touchmove',pointer,{passive:true});
addEventListener('touchend',()=>ptr.on=false);
addEventListener('mouseleave',()=>ptr.on=false);
addEventListener('resize',()=>{ size(); build(true); if(asked){ clearCentre(true); placeAsk(); } });

/* UI */
const cap=document.getElementById('cap'), note=document.getElementById('note'), hint=document.getElementById('hint');
document.getElementById('open').onclick=()=>{ note.classList.add('open'); document.getElementById('close').focus(); };
document.getElementById('close').onclick=()=>note.classList.remove('open');
note.addEventListener('click',e=>{ if(e.target===note) note.classList.remove('open'); });
addEventListener('keydown',e=>{ if(e.key==='Escape') note.classList.remove('open'); });

/* ---- The question ---- */
const ask=document.getElementById('ask'), yes=document.getElementById('yes'), no=document.getElementById('no');
document.getElementById('q').textContent = CONFIG.question;
document.getElementById('qs').textContent = CONFIG.questionHint;
function placeAsk(){ ask.style.top = portrait.cy + 'px'; }

/* push the dots out of the middle of the portrait so the question can sit there */
function clearCentre(on){
  const {cx,cy,a,b} = portrait;
  for(const p of particles){
    if(!on){ p.tx=p.ox; p.ty=p.oy; continue; }
    let dx=p.ox-cx, dy=p.oy-cy, e=Math.hypot(dx/a, dy/b);
    if(e>=1){ p.tx=p.ox; p.ty=p.oy; continue; }
    if(e<0.02){ const an=Math.random()*6.2832; dx=Math.cos(an)*a*.02; dy=Math.sin(an)*b*.02; e=0.02; }
    const s=(1+p.jit*0.3)/e; p.tx=cx+dx*s; p.ty=cy+dy*s;
  }
}
function openAsk(){
  if(asked || performance.now()-started < 4200) return;
  asked = true; placeAsk(); clearCentre(true);
  for(const p of particles){ p.vx+=(Math.random()-.5)*8; p.vy+=(Math.random()-.5)*8; }
  setTimeout(()=>ask.classList.add('show'), 350);
  hint.classList.remove('show');
}
cv.addEventListener('pointerdown', openAsk);

let dodges=0;
function dodge(e){
  if(e){ e.preventDefault(); }
  dodges++;
  if(!no.dataset.moved){ document.body.appendChild(no); no.dataset.moved=1; no.style.margin='0'; no.style.zIndex=10; no.style.pointerEvents='auto'; }
  no.style.position='fixed';
  no.style.left = (12+Math.random()*(W-130))+'px';
  no.style.top  = (70+Math.random()*(H-160))+'px';
  no.style.transform = 'scale('+Math.max(.6,1-dodges*.07)+')';
  yes.style.transform = 'scale('+Math.min(1.7,1+dodges*.1)+')';
  if(dodges>=5) document.getElementById('qs').textContent = "okay, there's only one right answer 😌";
}
no.addEventListener('pointerenter',dodge);
no.addEventListener('pointerdown',dodge);
no.addEventListener('click',dodge);

function floaters(){
  const set=['💖','💕','✨','🌸','💗','🎉'];
  for(let i=0;i<45;i++){
    const f=document.createElement('div'); f.className='fly';
    f.textContent=set[(Math.random()*set.length)|0];
    f.style.left=(Math.random()*100)+'vw'; f.style.fontSize=(18+Math.random()*26)+'px';
    f.style.setProperty('--d',(3+Math.random()*3)+'s'); f.style.setProperty('--r',(Math.random()*90-45)+'deg');
    f.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(f); setTimeout(()=>f.remove(),7000);
  }
}
yes.addEventListener('click',()=>{
  document.getElementById('q').textContent = CONFIG.yesTitle;
  document.getElementById('qs').textContent = CONFIG.yesLine;
  document.getElementById('btns').style.display='none'; no.style.display='none';
  for(const p of particles){ p.vx+=(Math.random()-.5)*26; p.vy+=(Math.random()-.5)*26; }
  floaters();
});

function start(){
  size(); build(false);
  requestAnimationFrame(frame);
  setTimeout(()=>cap.classList.add('show'), reduce?0:4200);
  setTimeout(()=>hint.classList.add('show'), reduce?0:5200);
  setTimeout(()=>hint.classList.remove('show'), 9500);
}

start();
</script>
